<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <title>Đăng nhập - Website Bán Sách</title>
    <link rel="stylesheet" type="text/css" href="Script/Style.css">
    <style>
        body {
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
        }
        .login-box {
            background-color: #fff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
            width: 350px;
        }
        .login-box h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #206AB5;
        }
        .login-box input[type="text"],
        .login-box input[type="password"] {
            width: 100%;
            padding: 10px;
            margin: 8px 0 16px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        .login-box input[type="submit"] {
            width: 100%;
            padding: 10px;
            background-color: #206AB5;
            color: white;
            border: none;
            border-radius: 4px;
            font-weight: bold;
            cursor: pointer;
            transition: background-color 0.3s;
        }
        .login-box input[type="submit"]:hover {
            background-color: #154c82;
        }
        .login-links {
            margin-top: 15px;
            text-align: right;
        }
        .login-links a {
            text-decoration: none;
            color: #206AB5;
            font-size: 14px;
        }
        .login-links a:hover {
            text-decoration: underline;
            color: red;
        }
    </style>
</head>
<body>

    <div class="login-box">
        <h2>ĐĂNG NHẬP</h2>
        <form action="Trangchu.html" method="post" onsubmit="return kiemTraDangNhap()">
            <label for="username">Tên đăng nhập:</label>
            <input type="text" id="username" name="username" placeholder="Nhập tên đăng nhập...">

            <label for="password">Mật khẩu:</label>
            <input type="password" id="password" name="password" placeholder="Nhập mật khẩu...">

            <input type="submit" value="Đăng nhập">
        </form>
        
        <div class="login-links">
            <a href="Dangky.html">Đăng ký</a>
        </div>
    </div>

    <!-- Nhúng file JS kiểm tra -->
    <script src="Script/kiemtra.js"></script>
</body>
</html>
